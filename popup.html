<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --bg: #1e1e1e;
      --card: #2d2d2d;
      --text: #e0e0e0;
      --accent: #4a90e2;
    }
    body { 
      width: 180px; 
      padding: 15px; 
      font-family: 'Segoe UI', system-ui, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      margin: 0;
    }
    h4 { margin: 10px 0 8px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: #aaa; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
    
    .color-btn { 
      height: 30px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; 
      transition: transform 0.1s, border-color 0.2s;
    }
    .color-btn:hover { transform: scale(1.05); }
    .color-btn.active { border-color: white; }

    #blue { background-color: #007bff; }
    #red { background-color: #dc3545; }
    #green { background-color: #28a745; }

    .action-btn { 
      width: 100%; margin: 4px 0; padding: 8px; border: none; border-radius: 6px;
      cursor: pointer; font-weight: 600; font-size: 12px; background: var(--card); color: white;
      transition: background 0.2s;
    }
    .action-btn:hover { background: #444; }
    #clear { color: #ff6b6b; margin-top: 10px; border: 1px solid #444; }

    .opacity-controls { display: flex; gap: 5px; background: var(--card); padding: 4px; border-radius: 8px; }
    .opacity-btn { 
      flex: 1; padding: 6px; border: none; border-radius: 5px; cursor: pointer; 
      background: transparent; color: #888; font-size: 11px;
    }
    .opacity-btn.active { background: var(--accent); color: white; }

    /* Modern Toggle Switch CSS */
.auto-mode-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card);
  padding: 10px;
  border-radius: 8px;
  margin: 10px 0;
}
.label-text { font-size: 12px; font-weight: 600; color: #ccc; }
.switch { position: relative; display: inline-block; width: 34px; height: 20px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
  background-color: #555; transition: .4s; border-radius: 34px;
}
.slider:before {
  position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
  background-color: white; transition: .4s; border-radius: 50%;
}
input:checked + .slider { background-color: var(--accent); }
input:checked + .slider:before { transform: translateX(14px); }

  </style>
</head>
<body>
  <h4>Colors</h4>
  <div class="grid">
    <div id="blue" class="color-btn" data-color="#007bff"></div>
    <div id="red" class="color-btn" data-color="#dc3545"></div>
    <div id="green" class="color-btn" data-color="#28a745"></div>
  </div>

  <button id="clearSelection" class="action-btn">Clear Selected</button>
  <button id="clear" class="action-btn">Clear All Page</button>

  <!-- Add this below the grid of colors -->
<div class="auto-mode-container">
  <span class="label-text">Auto-Highlight</span>
  <label class="switch">
    <input type="checkbox" id="autoModeToggle">
    <span class="slider round"></span>
  </label>
</div>

  <h4>Intensity</h4>
  <div class="opacity-controls">
    <button id="lowOpacity" class="opacity-btn">Low</button>
    <button id="defaultOpacity" class="opacity-btn active">Solid</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
