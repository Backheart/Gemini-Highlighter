<!DOCTYPE html>
<html lang="en">
<html>
<head>
  <style>
    body { width: 150px; padding: 10px; font-family: sans-serif; background: #1e1e1e; color: white; }
    .color-btn { width: 100%; margin: 5px 0; padding: 8px; border: none; cursor: pointer; color: white; font-weight: bold; }
    #blue { background-color: #007bff; }
    #red { background-color: #dc3545; }
    #green { background-color: #28a745; }
    #clear { background-color: #555; margin-top: 10px; }
  </style>
</head>
<body>
  <h4>Highlight Color</h4>
  <button id="blue" class="color-btn">Blue</button>
  <button id="red" class="color-btn">Red</button>
  <button id="green" class="color-btn">Green</button>
  <!-- Add this button in popup.html -->
<button id="clearSelection" class="color-btn" style="background-color: #777;">Clear Selection</button>
<button id="clear" class="color-btn">Clear All</button>
  <script src="popup.js"></script>
</body>
</html>
